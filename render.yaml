# Ein-Klick-Deployment auf Render (https://render.com) – Testumgebung für Kunden, Region Frankfurt.
services:
  - type: web
    name: anwaltapex
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /api/health
    disk:
      name: daten
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /data/anwaltapex.db
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_QUICK_LOGIN
        value: "true"
      - key: CONSOLE_ADMIN_EMAIL
        value: admin@anwaltapex.de
      - key: CONSOLE_ADMIN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        value: claude-opus-5-5
